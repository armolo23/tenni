version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tenni-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tenni}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tenni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:10-latest
    container_name: tenni-directus
    ports:
      - "${PORT:-8055}:8055"
    environment:
      # General
      PUBLIC_URL: ${PUBLIC_URL}

      # Database
      DB_CLIENT: ${DB_CLIENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Security
      SECRET: ${SECRET}
      KEY: ${KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Authentication
      AUTH_PROVIDERS: ${AUTH_PROVIDERS}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-directus_refresh_token}

      # CORS
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}

      # Email
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}

      # Storage
      STORAGE_LOCATIONS: ${STORAGE_LOCATIONS:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-./uploads}

      # Extensions
      EXTENSIONS_PATH: ${EXTENSIONS_PATH:-./extensions}

      # Rate Limiting
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-false}
      RATE_LIMITER_POINTS: ${RATE_LIMITER_POINTS:-25}
      RATE_LIMITER_DURATION: ${RATE_LIMITER_DURATION:-1}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_STYLE: ${LOG_STYLE:-pretty}

    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    networks:
      - tenni-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    name: tenni-postgres-data

networks:
  tenni-network:
    name: tenni-network
    driver: bridge
